name: Test HPXML Parser

on:
  workflow_dispatch:
  push:
    paths:
      - "hpxml-parser/**"
      - "test-homes/**"
      - "comparison-engine/**"
      - ".github/workflows/test-hpxml-parser.yml"

jobs:
  test-parser:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run basic HPXML parser
        run: python hpxml-parser/parser.py test-homes/sample-home.xml

      - name: Verify basic HPXML extraction
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "parser", "hpxml-parser/parser.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          result = module.parse_hpxml("test-homes/sample-home.xml")

          assert result["conditioned_floor_area"] == ["2200"]
          assert result["conditioned_volume"] == ["19800"]
          assert result["number_of_bedrooms"] == ["3"]
          assert result["insulation_r_value"] == ["15"]
          assert result["window_u_factor"] == ["0.30"]
          assert result["window_shgc"] == ["0.25"]

          print("Basic HPXML parser tests passed.")
          PY

      - name: Verify advanced HPXML extraction
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "advanced_parser", "hpxml-parser/advanced_parser.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          result = module.parse_hpxml("test-homes/sample-home.xml")

          assert result["building"]["conditioned_floor_area"] == ["2200"]
          assert result["building"]["conditioned_volume"] == ["19800"]

          assert len(result["walls"]) == 1
          assert result["walls"][0]["nominal_r_value"] == "15"

          assert len(result["windows"]) == 1
          assert result["windows"][0]["u_factor"] == "0.30"
          assert result["windows"][0]["shgc"] == "0.25"

          print("Advanced HPXML parser tests passed.")
          PY

      - name: Verify HPXML comparison engine
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "compare", "comparison-engine/compare.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          result = module.compare_files(
              "test-homes/sample-home.xml",
              "test-homes/sample-home-vendor-b.xml"
          )

          assert result["differences_found"] == 2, result

          fields = {
              item["field"] for item in result["differences"]
          }

          assert "walls[0].nominal_r_value" in fields
          assert "windows[0].u_factor" in fields

     
          print("Comparison engine passed: 2 differences found.")
          PY

      - name: Verify component ordering
        run: python comparison-engine/test_component_order.py
