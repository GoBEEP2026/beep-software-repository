name: Validate Reference Home Integrity


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read

jobs:
  validate-reference-integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate reference home integrity
        run: |
          python test-homes/validate_reference_integrity.py

      - name: Run reference integrity unit tests
        run: |
          python -m unittest discover \
            -s test-homes \
            -p "test_validate_reference_integrity.py" \
            -v

      - name: Run reference lifecycle unit tests
        run: |
          python -m unittest discover \
            -s test-homes \
            -p "test_validate_reference_lifecycle.py" \
            -v

      - name: Validate reference home approvals
        run: |
          python test-homes/validate_reference_approval.py

      - name: Run reference approval unit tests
        run: |
          python -m unittest discover \
            -s test-homes \
            -p "test_validate_reference_approval.py" \
            -v

      - name: Validate reference approval records
        run: |
          python test-homes/validate_approval_records.py

      - name: Run approval record unit tests
        run: |
          python -m unittest discover \
            -s test-homes \
            -p "test_validate_approval_records.py" \
            -v

      - name: Run Board authorization unit tests
        run: |
          python -m unittest discover \
            -s test-homes \
            -p "test_validate_board_authorization.py" \
            -v

      - name: Validate reference approval audit log
        run: python test-homes/validate_reference_audit.py

      - name: Test reference approval audit validation
        run: |
          python -m unittest discover \
            -s test-homes \
            -p "test_validate_reference_audit.py" \
            -v

      - name: Test append-only audit validation
        run: |
          python -m unittest discover \
            -s test-homes \
            -p "test_validate_audit_append_only.py" \
            -v

      - name: Verify approval audit history is append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "${BASE_SHA}:test-homes/reference-approval-audit.json" > /tmp/beep-previous-approval-audit.json
          python test-homes/validate_audit_append_only.py /tmp/beep-previous-approval-audit.json

      
      - name: Prepare previous reference home registry
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "${BASE_SHA}:test-homes/reference-home-registry.json" > /tmp/beep-previous-reference-registry.json
          python -m json.tool /tmp/beep-previous-reference-registry.json > /dev/null

      
      
      - name: Validate reference home lifecycle transitions
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python test-homes/validate_reference_lifecycle.py \
            /tmp/beep-previous-reference-registry.json \
            test-homes/reference-home-registry.json \
            "$BASE_SHA"


      - name: Run semantic versioning unit tests
        run: |
          python -m unittest discover -s test-homes -p "test_validate_reference_versioning.py" -v

      - name: Validate reference home semantic versions
        run: |
          python test-homes/validate_reference_versioning.py test-homes/reference-home-registry.json


      - name: Validate historical reference home versions
        if: always() && github.event_name == 'pull_request'
        run: |
          python test-homes/validate_reference_versioning.py --historical /tmp/beep-previous-reference-registry.json test-homes/reference-home-registry.json


      - name: Validate reference home change documentation
        if: always()
        run: |
          python test-homes/validate_reference_versioning.py --documentation test-homes/reference-home-registry.json
